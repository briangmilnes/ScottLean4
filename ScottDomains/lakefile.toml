name = "ScottDomains"
version = "0.1.0"
defaultTargets = ["ScottDomains"]

# Tracked, Mathlib-enabled Lean 4 project for Dana Scott's domain theory,
# separated from Playground so the domain-theory development stands on its own.
# Pinned to the same Mathlib as Beeson/lean4 and Playground (v4.32.2) so the
# olean cache is reused, not re-downloaded.  Its .lake/ build dir is gitignored.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.32.2"

[[lean_lib]]
name = "ScottDomains"
# Without globs, `lake build` elaborates only the modules reachable from the
# ScottDomains.lean root.  ExistingTheories.lean is not imported by it, so a
# Mathlib bump could break that file while the build still exits 0.
# `ScottDomains.+` covers the submodules but NOT the root module itself, so a
# clean checkout never built `ScottDomains.olean` — the main working copy was
# coasting on an artifact built before this glob was added, and `lake build` in a
# fresh git worktree failed with "object file ScottDomains.olean does not exist".
# Both entries are needed.
globs = ["ScottDomains", "ScottDomains.+"]
